name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_REPO: Mehedi259/wondertales
  BACKEND_TAG_LATEST: backend-latest
  AI_TAG_LATEST: ai-latest
  LANDINGPAGE_TAG_LATEST: landingpage-latest

jobs:
  dockerhub:
    name: Build, Tag and Push on Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.BACKEND_TAG_LATEST }}
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:${{ env.BACKEND_TAG_LATEST }}
          cache-to: type=inline

      - name: Build and Push AI image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.AI_TAG_LATEST }}
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:${{ env.AI_TAG_LATEST }}
          cache-to: type=inline

      - name: Build and Push landingpage image
        uses: docker/build-push-action@v5
        with:
          context: ./landingpage
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.LANDINGPAGE_TAG_LATEST }}
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:${{ env.LANDINGPAGE_TAG_LATEST }}
          cache-to: type=inline

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: dockerhub

    steps:
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/wondertales
            # Clean up old unused images and containers to free up space
            docker system prune -af
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
