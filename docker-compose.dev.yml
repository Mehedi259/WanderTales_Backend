version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wondertales-db-dev
    environment:
      POSTGRES_DB: wondertales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wondertales-backend-dev
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ./backend:/app
      - backend_static_dev:/app/staticfiles
      - backend_media_dev:/app/media
    ports:
      - "8001:8001"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wondertales
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: wondertales-ai-dev
    command: python main.py
    volumes:
      - ./ai:/app
      - ai_audio_dev:/app/audio_files
    ports:
      - "8000:8000"
    env_file:
      - ./ai/.env
    restart: unless-stopped

  landingpage:
    build:
      context: ./landingpage
      dockerfile: Dockerfile
    container_name: wondertales-frontend-dev
    command: npm run dev -- --host
    volumes:
      - ./landingpage:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_AI_SERVICE_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  postgres_data_dev:
  backend_static_dev:
  backend_media_dev:
  ai_audio_dev:
